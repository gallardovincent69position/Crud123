
name: Build and Deploy Ionic Vue CRUD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        shell: powershell
        run: |
          Write-Host "Current directory:"
          Write-Host $env:GITHUB_WORKSPACE

          Get-ChildItem $env:GITHUB_WORKSPACE

          if (!(Test-Path "$env:GITHUB_WORKSPACE/Dockerfile")) {
            throw "Dockerfile not found in repository root!"
          }

          Write-Host "Dockerfile found!"

      - name: Login to Docker Hub
        shell: powershell
        run: |
          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        shell: powershell
        run: |
          docker build -f "$env:GITHUB_WORKSPACE/Dockerfile" -t "$env:DOCKERHUB_USERNAME/vincent-ionic-crud:latest" "$env:GITHUB_WORKSPACE"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push Docker Image
        shell: powershell
        run: |
          docker push "$env:DOCKERHUB_USERNAME/vincent-ionic-crud:latest"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Deploy Application
        shell: powershell
        run: |
          docker pull "$env:DOCKERHUB_USERNAME/vincent-ionic-crud:latest"

          docker rm -f vincent-crud-app 2>$null

          docker run -d `
            --name vincent-crud-app `
            --restart unless-stopped `
            -p 8081:80 `
            "$env:DOCKERHUB_USERNAME/vincent-ionic-crud:latest"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
