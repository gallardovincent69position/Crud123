
name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      # 1. Get the latest source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Check Docker installation
      - name: Check Docker
        shell: powershell
        run: |
          docker --version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker is not installed or unavailable!"
          }

      # 3. Verify Dockerfile
      - name: Check Dockerfile
        shell: powershell
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE/Dockerfile")) {
            throw "Dockerfile not found in repository root!"
          }

          Write-Host "Dockerfile found!"

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "Docker Hub username secret is missing!"
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Docker Hub token secret is missing!"
          }

          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed!"
          }

      # 5. Build Ionic Vue Docker Image
      - name: Build Docker Image
        shell: powershell
        run: |
          docker build -t cedricbakin06/ionic-vue-firebase-crud:latest .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed!"
          }

      # 6. Push Docker Image to Docker Hub
      - name: Push Docker Image
        shell: powershell
        run: |
          docker push cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed!"
          }

      # 7. Stop and remove previous container
      - name: Stop Existing Container
        shell: powershell
        run: |
          $container = docker ps -aq --filter "name=^ionic-vue-app$"

          if ($container) {
            docker stop ionic-vue-app
            docker rm ionic-vue-app
          }

      # 8. Pull latest Docker image
      - name: Pull Latest Docker Image
        shell: powershell
        run: |
          docker pull cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed!"
          }

      # 9. Run updated container
      - name: Run Updated Container
        shell: powershell
        run: |
          docker run -d `
            -p 8080:80 `
            --name ionic-vue-app `
            --restart unless-stopped `
            cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Container deployment failed!"
          }

      # 10. Verify deployment
      - name: Verify Deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $container = docker ps --filter "name=^ionic-vue-app$" --filter "status=running" -q

          if (!$container) {
            docker logs ionic-vue-app
            throw "Container is not running!"
          }

          Write-Host "Container successfully deployed!"

          docker ps
