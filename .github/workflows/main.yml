
name: Ionic Vue Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Check Docker Installation
      - name: Check Docker
        shell: powershell
        run: |
          docker --version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker is not installed or unavailable!"
          }

      # 3. Check Docker Engine
      - name: Check Docker Engine
        shell: powershell
        run: |
          docker info

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Engine is not running!"
          }

      # 4. Verify Required Files
      - name: Check Project Files
        shell: powershell
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE/Dockerfile")) {
            throw "Dockerfile not found!"
          }

          if (!(Test-Path "$env:GITHUB_WORKSPACE/package.json")) {
            throw "package.json not found!"
          }

          Write-Host "Required project files found!"

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_USERNAME)) {
            throw "Docker Hub username secret is missing!"
          }

          if ([string]::IsNullOrWhiteSpace($env:DOCKERHUB_TOKEN)) {
            throw "Docker Hub token secret is missing!"
          }

          Write-Host "Docker Hub username configured."
          Write-Host "Token length: $($env:DOCKERHUB_TOKEN.Length)"

          $env:DOCKERHUB_TOKEN | docker login -u $env:DOCKERHUB_USERNAME --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed!"
          }

          Write-Host "Docker Hub login successful!"

      # 6. Build Ionic Vue Docker Image
      - name: Build Docker Image
        shell: powershell
        run: |
          docker build `
            -t cedricbakin06/ionic-vue-firebase-crud:latest .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed!"
          }

          Write-Host "Docker image built successfully!"

      # 7. Push Docker Image to Docker Hub
      - name: Push Docker Image
        shell: powershell
        run: |
          docker push cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image push failed!"
          }

          Write-Host "Docker image pushed successfully!"

      # 8. Pull Latest Docker Image
      - name: Pull Latest Docker Image
        shell: powershell
        run: |
          docker pull cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed!"
          }

      # 9. Stop Existing Container
      - name: Stop Existing Container
        shell: powershell
        run: |
          $container = docker ps -aq --filter "name=^ionic-vue-app$"

          if ($container) {
            docker stop ionic-vue-app

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to stop existing container!"
            }

            docker rm ionic-vue-app

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove existing container!"
            }
          }

      # 10. Deploy Updated Container
      - name: Run Updated Container
        shell: powershell
        run: |
          docker run -d `
            -p 8080:80 `
            --name ionic-vue-app `
            --restart unless-stopped `
            cedricbakin06/ionic-vue-firebase-crud:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Container deployment failed!"
          }

          Write-Host "Container deployed successfully!"

      # 11. Verify Deployment
      - name: Verify Deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $container = docker ps `
            --filter "name=^ionic-vue-app$" `
            --filter "status=running" -q

          if (!$container) {
            docker logs ionic-vue-app
            throw "Container is not running!"
          }

          Write-Host "Deployment successful!"

          docker ps

      # 12. Logout from Docker Hub
      - name: Logout from Docker Hub
        if: always()
        shell: powershell
        run: |
          docker logout

          Write-Host "Docker Hub logout completed!"
