
name: Ionic Vue CRUD - Docker Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Build Docker Image
      - name: Build Docker Image
        shell: powershell
        run: |
          docker build -t cedricbakin06/vincent-ionic-crud:latest .

      # 3. Push Docker Image to Docker Hub
      - name: Push Docker Image
        shell: powershell
        run: |
          docker push cedricbakin06/vincent-ionic-crud:latest

      # 4. Remove Previous Deployment
      - name: Remove Previous Deployment
        shell: powershell
        run: |
          docker stop vincent-crud-app 2>$null
          docker rm vincent-crud-app 2>$null
          exit 0

      # 5. Deploy New Container
      - name: Deploy Docker Container
        shell: powershell
        run: |
          docker run -d `
            --name vincent-crud-app `
            --restart unless-stopped `
            -p 8081:80 `
            cedricbakin06/vincent-ionic-crud:latest

      # 6. Verify Deployment
      - name: Verify Docker Deployment
        shell: powershell
        run: |
          docker ps --filter "name=vincent-crud-app"
